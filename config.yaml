# =====================================================================
# CONFIGURAZIONE DELLA DASHBOARD
# ---------------------------------------------------------------------
# Qui si decide QUALI dati scaricare. Il codice Python legge questo file
# e non contiene elenchi di serie "scritti a mano".
#
# Per aggiungere una serie basta copiare un blocco e cambiarne i campi:
#   id             codice della serie presso la fonte (es. su FRED "DGS10")
#   fonte          modulo che la scarica: "fred", "ecb", "yahoo", "bis", "mof" (Giappone) o "statjp"
#                  (Statistics Bureau of Japan via DBnomics)
#                  oppure "calcolata" = differenza o rapporto tra due altre serie (vedi componenti)
#                  Per la BCE l'id è "DATASET/CHIAVE", es. FM/D.U2.EUR.4F.KR.DFR.LEV
#                  Per Yahoo l'id è il ticker, es. CL=F (future continuo sul WTI)
#                  Per il BIS l'id è "DATASET/CHIAVE", es. WS_CBPOL/D.JP (tasso di policy del Giappone)
#                  Per "mof" l'id è JGB_ seguito dalla scadenza, es. JGB_10Y; per "statjp" è "CPIm/740"
#   nome           etichetta mostrata sul sito
#   paese          a quale Paese appartiene (una chiave del blocco "colori": us, ea, it, de, fr, jp, cn, kr, uk) oppure
#                  "global" per le materie prime e gli indici mondiali. Decide il colore del grafico e l'etichetta "area"
#                  della pagina Series status
#   categoria      gruppo tematico (serve a orientarsi e per i confronti futuri)
#   unita          unità DOPO la trasformazione (testo mostrato sul sito, in inglese): "%", "% y/y", "index", "points"
#   trasformazione "livello" = dato così com'è
#                  "yoy"     = variazione % rispetto a un anno prima
#
# Campi facoltativi:
#   colore         chiave del blocco "colori" se diversa dal paese (es. la Germania usa il colore dell'area euro:
#                  paese: de, colore: ea; le materie prime usano il gruppo: colore: energia)
#   riserva        fonte alternativa se la principale non risponde, es.
#                    riserva: {fonte: fred, id: ECBDFR}
#                  (si può aggiungere "trasformazione" se diversa da quella principale,
#                  "unita" se la riserva è in un'altra unità di misura e "nota" per
#                  spiegare in cosa è diversa, es. "prezzo spot, non future")
#   componenti     solo per fonte "calcolata": [A, B] -> la serie è A − B,
#                  calcolata nelle date in cui esistono entrambe.
#                  REGOLA: si calcola solo se A e B vengono dalla stessa fonte principale;
#                  se anche una sola è passata alla riserva, la serie è "non disponibile".
#   operazione     solo per fonte "calcolata": "differenza" (A − B, predefinita) o "rapporto" (A / B)
#   fattore        solo per fonte "calcolata": moltiplica il risultato (es. 1000 per un rapporto piccolo)
#   decimali       cifre decimali mostrate sul sito (predefinito 2)
#   movimenti      true = la serie entra nel calcolo "What changed this week" dell'Overview (solo serie giornaliere o settimanali);
#                  richiede gruppo_movimenti. Non metterlo ai tassi di policy (cambiano a scatti) né alle serie mensili.
#   gruppo_movimenti  nel calcolo conta al massimo UNA serie per gruppo (es. tutti i tassi USA muovono insieme)
#   etichetta_breve   nome più chiaro per l'Overview, se "nome" da solo è ambiguo (es. "Euro AAA 10Y yield")
#   soglia_giorni  soglia di freschezza propria della serie (giorni), al posto di quella standard
#                  per la sua frequenza. Da usare SOLO con un motivo scritto accanto (es. fonte lenta)
#
# Nota: una serie scaricata ma non usata da nessun grafico compare comunque nella pagina Series status.
# I numeri chiave di ogni pagina non sono più un campo delle serie: stanno nel blocco "pagine" (numeri_chiave).
# =====================================================================

# Menu in cima a ogni pagina: "pagina" = id di una pagina (o "home"); "figli" = voce con una seconda riga di link.
# La voce con "figli" porta alla prima pagina figlia.
menu:
  - {titolo: Home, pagina: home}
  - {titolo: Markets, figli: [markets, markets/rates, markets/credit, markets/equities, markets/fx, markets/commodities]}
  - {titolo: Economies, figli: [economies, economies/usa, economies/italy, economies/euro-area, economies/uk, economies/compare]}
  - {titolo: Method & sources, figli: [method, method/series]}

# Le pagine del sito (vedi docs/ristrutturazione.md). Una pagina per voce, all'indirizzo site/<id>/.
#   id             percorso della pagina (markets/commodities -> site/markets/commodities/index.html)
#   nome           titolo (H1)
#   titolo_menu    voce del menu se diversa dal nome
#   descrizione    UNA riga su cosa mostra la pagina
#   tipo           "hub" = pagina indice con le schede delle sue pagine figlie (quelle con gruppo = id dell'hub)
#   gruppo         id dell'hub a cui appartiene
#   stato          "attiva" (pagina con contenuti: serve il costruttore in dashboard/mercati/ o dashboard/economie/),
#                  "in-arrivo" (pagina vuota "coming soon") oppure "dopo" (solo scheda "later" nell'hub, nessuna pagina)
#   numeri_chiave  serie mostrate come schede in cima alla pagina; ytd: true = con anche la variazione da inizio anno
pagine:
  - id: markets
    nome: Markets
    titolo_menu: Overview
    tipo: hub
    descrizione: Rates, credit, equities, currencies and commodities, with countries compared on the same chart.
  - id: markets/rates
    nome: Rates & curves
    gruppo: markets
    stato: attiva
    descrizione: Policy rates, government yield curves, 10-year yields, the slope of the curve, inflation and real rates across economies.
    numeri_chiave: ["DFF", "FM/D.U2.EUR.4F.KR.DFR.LEV", "DGS10", "YC/B.U2.EUR.4F.G_N_A.SV_C_YM.SR_10Y", "JGB_10Y", "T10Y2Y",
                    "CPIAUCSL", "HICP/M.U2.N.000000.4D0.ANR"]
  - id: markets/credit
    nome: Credit
    gruppo: markets
    stato: attiva
    descrizione: Corporate bond spreads and sovereign spreads, the price of risk in bond markets.
    numeri_chiave: ["BAMLH0A0HYM2", "BAMLHE00EHYIOAS", "BAMLC0A0CM", "BAA10Y", "SPREAD_BTP_BUND", "EA_TUTTI_MENO_AAA_10A"]
  - id: markets/equities
    nome: Equities
    gruppo: markets
    stato: attiva
    descrizione: Stock market indices compared, in local currency or in dollars, and market volatility.
    numeri_chiave: ["^GSPC", "^STOXX50E", "^N225", "^KS11", "ACWI", "VIXCLS"]
  - id: markets/fx
    nome: FX
    gruppo: markets
    stato: attiva
    descrizione: The euro, yen, yuan and won against the US dollar, and the broad dollar index.
    numeri_chiave: ["EXR/D.USD.EUR.SP00.A", "JPY=X", "CNY=X", "KRW=X", "DTWEXBGS"]
  - id: markets/commodities
    nome: Commodities
    gruppo: markets
    stato: attiva
    descrizione: Energy, metals and agricultural prices, how they have changed recently, and how they relate to US interest rates.
    numeri_chiave: ["BZ=F", "CL=F", "NG=F", "GC=F", "HG=F", "ZW=F"]
    ytd: true

  # ---- Economies: per ora solo la struttura (le pagine dei Paesi si riempiono dopo) ----
  - id: economies
    nome: Economies
    titolo_menu: Overview
    tipo: hub
    descrizione: "One page per economy: growth, jobs, prices, public finances and policy. For now this is the structure; the content will follow."
  - id: economies/usa
    nome: United States
    gruppo: economies
    stato: attiva
    descrizione: The US economy. For now the labour market; growth, prices and the Fed will follow.
    numeri_chiave: ["UNRATE"]
  - id: economies/italy
    nome: Italy
    gruppo: economies
    stato: in-arrivo
    descrizione: "Italy's economy: growth, jobs, prices, public finances and the BTP-Bund spread."
  - id: economies/euro-area
    nome: Euro area
    gruppo: economies
    stato: in-arrivo
    descrizione: "The euro-area economy: growth, jobs, inflation and the ECB."
  - id: economies/uk
    nome: United Kingdom
    gruppo: economies
    stato: in-arrivo
    descrizione: "The UK economy: growth, jobs, inflation and the Bank of England."
  - id: economies/compare
    nome: Compare
    gruppo: economies
    stato: in-arrivo
    descrizione: Economies side by side on the same indicators.
  - id: economies/japan
    nome: Japan
    gruppo: economies
    stato: dopo
    descrizione: The Japanese economy.
  - id: economies/china
    nome: China
    gruppo: economies
    stato: dopo
    descrizione: The Chinese economy.
  - id: economies/south-korea
    nome: South Korea
    gruppo: economies
    stato: dopo
    descrizione: The South Korean economy.

# I numeri chiave dell'Overview (home): gruppi di schede. Ogni scheda mostra l'ultimo valore, il mini-grafico a un anno e le variazioni.
#   serie      id della serie
#   etichetta  nome mostrato sulla scheda
#   vai        id del grafico a cui porta il clic (il link si costruisce da solo)
panoramica:
  - titolo: Policy & inflation
    schede:
      - {serie: DFF, etichetta: Fed funds rate, vai: mk-rates-fed-ecb}
      - {serie: "FM/D.U2.EUR.4F.KR.DFR.LEV", etichetta: ECB deposit rate, vai: mk-rates-fed-ecb}
      - {serie: CPIAUCSL, etichetta: US inflation (CPI), vai: usa-inflazione}
      - {serie: "HICP/M.U2.N.000000.4D0.ANR", etichetta: Euro-area inflation (HICP), vai: eur-inflazione}
  - titolo: Rates
    schede:
      - {serie: DGS10, etichetta: US 10Y Treasury yield, vai: usa-rendimenti}
      - {serie: "YC/B.U2.EUR.4F.G_N_A.SV_C_YM.SR_10Y", etichetta: Euro AAA 10Y yield (Bund proxy), vai: eur-rendimenti}
      - {serie: SPREAD_BTP_BUND, etichetta: BTP-Bund spread (monthly), vai: eur-spread-paesi}
      - {serie: T10Y2Y, etichetta: US 10Y-2Y spread, vai: mk-rates-slope}
  - titolo: Markets
    schede:
      - {serie: "^GSPC", etichetta: S&P 500, vai: gl-borse}
      - {serie: "^STOXX50E", etichetta: Euro Stoxx 50, vai: gl-borse}
      - {serie: "EXR/D.USD.EUR.SP00.A", etichetta: EUR/USD, vai: eur-eurusd}
      - {serie: "GC=F", etichetta: Gold, vai: com-oro}
      - {serie: "BZ=F", etichetta: Brent oil, vai: com-petrolio}
      - {serie: VIXCLS, etichetta: VIX (expected US stock volatility), vai: usa-vix}

# Catalogo degli indicatori ANNUALI per Paese (FMI WEO e Banca Mondiale). Non sono `serie`: sono ~200 Paesi per indicatore e si leggono
# da uno snapshot nel repository (dati/weo/, dati/bm/), scritto da tools/aggiorna_weo.py (o dall'importatore del file WEO) e da
# tools/aggiorna_bm.py. Il catalogo dice quali indicatori scaricare e come chiamarli sul sito (dashboard/annuali.py).
#   id           id interno
#   nome, unita  testi sul sito (inglese)
#   fonte        imf (WEO) o wb (Banca Mondiale)
#   codice       codice presso la fonte
#   sezione      sezione della pagina del Paese (step 10b)
#   decimali     cifre decimali mostrate sul sito
#   sorgente_wb  solo wb: 2 = WDI (predefinito), 3 = WGI
#   ultimo_effettivo_da  solo imf: se l'FMI non indica l'ultimo anno con dato reale di questo indicatore (accade per PPPPC),
#                lo si copia da un altro indicatore (qui NGDPD, stesso Paese): è lo stesso aggiornamento dei conti nazionali
#   nota         avvertenza breve per chi legge i dati
# Scelte (docs/economies-fonti.md): macro dal WEO (194 Paesi); Banca Mondiale solo per lavoro (stime ILO modellate), popolazione storica e WGI;
# i codici WB dell'inflazione, del debito e delle partite correnti sono stati scartati per copertura scarsa; disoccupazione WEO (LUR) scartata (115 Paesi).
indicatori:
  # ---------------------------------------------------------------- FMI WEO
  - {id: gdp_nominal, nome: Nominal GDP, unita: USD bn, fonte: imf, codice: NGDPD, sezione: output, decimali: 1}
  - {id: gdp_growth, nome: Real GDP growth, unita: "% y/y", fonte: imf, codice: NGDP_RPCH, sezione: output, decimali: 1}
  - {id: gdp_per_capita_ppp, nome: "GDP per capita, PPP", unita: international $, fonte: imf, codice: PPPPC, sezione: output, decimali: 0,
     ultimo_effettivo_da: NGDPD, nota: "The IMF does not flag the latest actual year of this indicator: the one of nominal GDP is used."}
  - {id: gdp_per_capita_usd, nome: "GDP per capita, current USD", unita: USD, fonte: imf, codice: NGDPDPC, sezione: output, decimali: 0}
  - {id: inflation_average, nome: "Inflation, average consumer prices", unita: "% y/y", fonte: imf, codice: PCPIPCH, sezione: prices, decimali: 1}
  - {id: inflation_end_of_period, nome: "Inflation, end of period", unita: "% y/y", fonte: imf, codice: PCPIEPCH, sezione: prices, decimali: 1}
  - {id: government_balance, nome: General government net lending/borrowing, unita: "% of GDP", fonte: imf, codice: GGXCNL_NGDP, sezione: public-finances, decimali: 1}
  - {id: government_primary_balance, nome: General government primary balance, unita: "% of GDP", fonte: imf, codice: GGXONLB_NGDP, sezione: public-finances, decimali: 1}
  - {id: government_debt, nome: General government gross debt, unita: "% of GDP", fonte: imf, codice: GGXWDG_NGDP, sezione: public-finances, decimali: 1}
  - {id: current_account, nome: Current account balance, unita: "% of GDP", fonte: imf, codice: BCA_NGDPD, sezione: external, decimali: 1}
  - {id: population_imf, nome: Population (IMF), unita: millions, fonte: imf, codice: LP, sezione: output, decimali: 1}
  # ---------------------------------------------------------------- Banca Mondiale: WDI
  - {id: unemployment_ilo, nome: Unemployment rate (ILO modelled estimate), unita: "% of labour force", fonte: wb, codice: SL.UEM.TOTL.ZS, sezione: labour, decimali: 1,
     nota: "ILO modelled estimate, not a national statistic: comparable across countries but it can differ from the official figure."}
  - {id: employment_ilo, nome: "Employment-to-population ratio, 15+ (ILO modelled estimate)", unita: "% of population 15+", fonte: wb, codice: SL.EMP.TOTL.SP.ZS, sezione: labour, decimali: 1,
     nota: "ILO modelled estimate, not a national statistic; population 15+, so it moves with population ageing."}
  - {id: population, nome: Population (World Bank), unita: persons, fonte: wb, codice: SP.POP.TOTL, sezione: output, decimali: 0}
  - {id: gdp_nominal_wb, nome: Nominal GDP (World Bank), unita: current USD, fonte: wb, codice: NY.GDP.MKTP.CD, sezione: output, decimali: 0,
     nota: "Longer history than the IMF (from 1960): used for the years before 1980."}
  - {id: gdp_growth_wb, nome: Real GDP growth (World Bank), unita: "% y/y", fonte: wb, codice: NY.GDP.MKTP.KD.ZG, sezione: output, decimali: 1,
     nota: "Longer history than the IMF (from 1961): used for the years before 1980."}
  - {id: gdp_per_capita_ppp_wb, nome: "GDP per capita, PPP (World Bank)", unita: international $, fonte: wb, codice: NY.GDP.PCAP.PP.CD, sezione: output, decimali: 0,
     nota: "From 1990. Use one source per chart: the PPP rounds of the IMF and of the World Bank are not the same."}
  # ---------------------------------------------------------------- Banca Mondiale: WGI (sorgente 3). Solo il punteggio 0-100 con l'intervallo al 90%: nessun rango.
  - {id: corruption_score, nome: "Control of Corruption, score (0-100)", unita: score 0-100, fonte: wb, codice: GOV_WGI_CC.SC, sorgente_wb: 3, sezione: governance, decimali: 0,
     nota: "Perception-based composite on an absolute 0-100 scale (WGI 2025 method). It is a score, not a rank."}
  - {id: corruption_score_low, nome: "Control of Corruption, lower bound of the 90% interval", unita: score 0-100, fonte: wb, codice: GOV_WGI_CC.SC_LB, sorgente_wb: 3, sezione: governance, decimali: 0}
  - {id: corruption_score_high, nome: "Control of Corruption, upper bound of the 90% interval", unita: score 0-100, fonte: wb, codice: GOV_WGI_CC.SC_UB, sorgente_wb: 3, sezione: governance, decimali: 0}

# Recessioni disegnate come bande grigie, per le regioni senza una serie scaricabile.
# (Per gli USA si usa la serie FRED USREC, più in basso.)
recessioni:
  eurozona:
    # Fonte: CEPR-EABCN Euro Area Business Cycle Dating Committee (https://cepr.org),
    # l'equivalente europeo del NBER. Non ha un'API: le date vanno copiate a mano
    # quando il comitato annuncia un nuovo picco o minimo.
    # picco = ultimo trimestre di espansione; minimo = ultimo trimestre di recessione.
    # Elenco aggiornato alla recessione Covid del 2020. A settembre 2026 il sito CEPR non era
    # consultabile in automatico: controllare a mano se ci sono annunci successivi.
    fonte: CEPR-EABCN Euro Area Business Cycle Dating Committee
    periodi:
      - {picco: 1974Q3, minimo: 1975Q1}
      - {picco: 1980Q1, minimo: 1982Q3}
      - {picco: 1992Q1, minimo: 1993Q3}
      - {picco: 2008Q1, minimo: 2009Q2}
      - {picco: 2011Q3, minimo: 2013Q1}
      - {picco: 2019Q4, minimo: 2020Q2}

# Colori fissi dei grafici: ogni Paese (e ogni gruppo di materie prime) ha SEMPRE lo stesso colore, in tutte le pagine.
# "chiaro" e "scuro" sono lo stesso colore regolato per i due temi. Gli 8 colori dei Paesi sono stati verificati con
# tools/valida_palette.py (tutte le 28 coppie: distinguibili anche con daltonismo; contrasto con lo sfondo almeno 3:1 in entrambi
# i temi; da rilanciare se si cambia un colore).
# "alias: us" = stesso colore di un'altra voce. "mondo" è il colore neutro del benchmark (indice mondiale).
# In un grafico, più serie con lo stesso colore si distinguono dallo stile della linea (piena, tratteggiata, puntinata).
colori:
  us: {nome: United States,  gruppo: paese, chiaro: "#2e4aa6", scuro: "#5d89ff"}
  ea: {nome: Euro area,      gruppo: paese, chiaro: "#c27d00", scuro: "#ca8412"}
  it: {nome: Italy,          gruppo: paese, chiaro: "#2ea46c", scuro: "#3bad75"}
  jp: {nome: Japan,          gruppo: paese, chiaro: "#bf1000", scuro: "#d5301c"}
  cn: {nome: China,          gruppo: paese, chiaro: "#de37a5", scuro: "#c3118e"}
  kr: {nome: South Korea,    gruppo: paese, chiaro: "#8b59f9", scuro: "#7942e2"}
  uk: {nome: United Kingdom, gruppo: paese, chiaro: "#5183c1", scuro: "#3a6ca8"}
  fr: {nome: France,         gruppo: paese, chiaro: "#1a6937", scuro: "#2f7a47"}
  de: {nome: Germany,        gruppo: alias, alias: ea}
  global: {nome: Global,     gruppo: alias, alias: mondo}
  energia:             {nome: Energy,            gruppo: materia_prima, alias: jp}
  metalli_preziosi:    {nome: Precious metals,   gruppo: materia_prima, alias: ea}
  metalli_industriali: {nome: Industrial metals, gruppo: materia_prima, alias: kr}
  agricoli:            {nome: Agricultural,      gruppo: materia_prima, alias: it}
  mondo:               {nome: World benchmark,   gruppo: neutro, chiaro: "#52514e", scuro: "#c3c2b7"}

