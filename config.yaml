# =====================================================================
# CONFIGURAZIONE DELLA DASHBOARD
# ---------------------------------------------------------------------
# Qui si decide QUALI dati scaricare. Il codice Python legge questo file
# e non contiene elenchi di serie "scritti a mano".
#
# Per aggiungere una serie basta copiare un blocco e cambiarne i campi:
#   id             codice della serie presso la fonte (es. su FRED "DGS10")
#   fonte          modulo che la scarica: "fred", "ecb", "yahoo", "bis", "mof" (Giappone) o "statjp"
#                  (Statistics Bureau of Japan via DBnomics)
#                  oppure "calcolata" = differenza o rapporto tra due altre serie (vedi componenti)
#                  Per la BCE l'id è "DATASET/CHIAVE", es. FM/D.U2.EUR.4F.KR.DFR.LEV
#                  Per Yahoo l'id è il ticker, es. CL=F (future continuo sul WTI)
#                  Per il BIS l'id è "DATASET/CHIAVE", es. WS_CBPOL/D.JP (tasso di policy del Giappone)
#                  Per "mof" l'id è JGB_ seguito dalla scadenza, es. JGB_10Y; per "statjp" è "CPIm/740"
#   nome           etichetta mostrata sul sito
#   regione        pagina in cui compare (deve esistere nella lista "regioni"; provvisorio fino allo step 5)
#   paese          a quale Paese appartiene (us, ea, it, de, fr, jp, cn, kr, uk) oppure "global" per le materie prime
#                  e gli indici mondiali. Decide il colore del grafico (vedi il blocco "colori")
#   categoria      gruppo tematico (serve a orientarsi e per i confronti futuri)
#   unita          unità DOPO la trasformazione (testo mostrato sul sito, in inglese): "%", "% y/y", "index", "points"
#   trasformazione "livello" = dato così com'è
#                  "yoy"     = variazione % rispetto a un anno prima
#   riepilogo      true = compare nella scheda riassuntiva in cima alla pagina
#
# Campi facoltativi:
#   colore         chiave del blocco "colori" se diversa dal paese (es. la Germania usa il colore dell'area euro:
#                  paese: de, colore: ea; le materie prime usano il gruppo: colore: energia)
#   riserva        fonte alternativa se la principale non risponde, es.
#                    riserva: {fonte: fred, id: ECBDFR}
#                  (si può aggiungere "trasformazione" se diversa da quella principale,
#                  "unita" se la riserva è in un'altra unità di misura e "nota" per
#                  spiegare in cosa è diversa, es. "prezzo spot, non future")
#   componenti     solo per fonte "calcolata": [A, B] -> la serie è A − B,
#                  calcolata nelle date in cui esistono entrambe.
#                  REGOLA: si calcola solo se A e B vengono dalla stessa fonte principale;
#                  se anche una sola è passata alla riserva, la serie è "non disponibile".
#   operazione     solo per fonte "calcolata": "differenza" (A − B, predefinita) o "rapporto" (A / B)
#   fattore        solo per fonte "calcolata": moltiplica il risultato (es. 1000 per un rapporto piccolo)
#   decimali       cifre decimali mostrate sul sito (predefinito 2)
#   soglia_giorni  soglia di freschezza propria della serie (giorni), al posto di quella standard
#                  per la sua frequenza. Da usare SOLO con un motivo scritto accanto (es. fonte lenta)
#
# Nota: una serie scaricata ma non usata da nessun grafico compare comunque
# nella scheda riassuntiva (se riepilogo: true) e nella tabella "Stato delle serie".
# =====================================================================

# Pagine del sito (una pagina HTML per regione: site/<id>/index.html). "attiva: false" = pagina "in arrivo".
# Provvisorio: nello step 5 della ristrutturazione (docs/ristrutturazione.md) "regioni" diventa "pagine".
regioni:
  - id: usa
    nome: United States
    descrizione: Monetary policy, the Treasury curve, real rates, inflation, credit, equities and financial conditions.
    attiva: true
  - id: eurozona
    nome: Euro area
    descrizione: ECB policy rate, the AAA curve (Bund proxy), sovereign spreads, HICP inflation, credit, equities and EUR/USD.
    attiva: true
  # Le materie prime non sono più una pagina "regione" (ora sono la pagina markets/commodities, vedi "pagine"),
  # ma le loro serie appartengono ancora a questa regione. "senza_pagina" = non si genera una pagina per questa voce.
  - id: commodities
    nome: Commodities
    attiva: true
    senza_pagina: true
  # Asia (fase 3): tre paesi, nessuna banda di recessione (nessuna fonte ufficiale e automatica)
  - id: giappone
    nome: Japan
    descrizione: BoJ policy rate, JGB yields, inflation, the yen and the Nikkei.
    attiva: true
  - id: cina
    nome: China
    descrizione: Loan Prime Rate, inflation, the yuan, the CSI 300 and the Hang Seng.
    attiva: true
  - id: corea
    nome: South Korea
    descrizione: BoK base rate, the 10-year yield, inflation, the won and the KOSPI.
    attiva: true
  - id: globale
    nome: Global comparison
    descrizione: Policy rates, 10-year yields, inflation, currencies and equities of five economies on the same chart.
    attiva: true

# Menu in cima a ogni pagina (provvisorio, come "regioni"): "pagina" = id di una regione (o "home");
# "figli" = voce con una seconda riga di link. La voce con "figli" porta alla prima pagina figlia.
menu:
  - {titolo: Home, pagina: home}
  - {titolo: Countries, figli: [usa, eurozona, giappone, cina, corea]}
  - {pagina: globale}
  - {titolo: Markets, figli: [markets, markets/rates, markets/credit, markets/equities, markets/fx, markets/commodities]}
  - {titolo: Method & sources, figli: [method, method/series]}

# Le NUOVE pagine del sito (ristrutturazione, vedi docs/ristrutturazione.md). Una pagina per voce, all'indirizzo site/<id>/.
#   id             percorso della pagina (markets/commodities -> site/markets/commodities/index.html)
#   nome           titolo (H1)
#   titolo_menu    voce del menu se diversa dal nome
#   descrizione    UNA riga su cosa mostra la pagina
#   tipo           "hub" = pagina indice con le schede delle sue pagine figlie (quelle con gruppo = id dell'hub)
#   gruppo         id dell'hub a cui appartiene
#   stato          "attiva" (si genera; serve il costruttore in dashboard/mercati/__init__.py) oppure "in-arrivo" (solo scheda nell'hub)
#   numeri_chiave  serie mostrate come schede in cima alla pagina; ytd: true = con anche la variazione da inizio anno
# Il vecchio blocco "regioni" sparirà allo step 5, quando tutte le pagine saranno qui.
pagine:
  - id: markets
    nome: Markets
    titolo_menu: Overview
    tipo: hub
    descrizione: Rates, credit, equities, currencies and commodities, with countries compared on the same chart.
  - id: markets/rates
    nome: Rates & curves
    gruppo: markets
    stato: attiva
    descrizione: Policy rates, government yield curves, 10-year yields and the slope of the curve across economies.
    numeri_chiave: ["DFF", "FM/D.U2.EUR.4F.KR.DFR.LEV", "DGS10", "YC/B.U2.EUR.4F.G_N_A.SV_C_YM.SR_10Y", "JGB_10Y", "T10Y2Y"]
  - id: markets/credit
    nome: Credit
    gruppo: markets
    stato: attiva
    descrizione: Corporate bond spreads and sovereign spreads, the price of risk in bond markets.
    numeri_chiave: ["BAMLH0A0HYM2", "BAMLHE00EHYIOAS", "BAMLC0A0CM", "BAA10Y", "SPREAD_BTP_BUND", "EA_TUTTI_MENO_AAA_10A"]
  - id: markets/equities
    nome: Equities
    gruppo: markets
    stato: attiva
    descrizione: Stock market indices compared, in local currency or in dollars, and market volatility.
    numeri_chiave: ["^GSPC", "^STOXX50E", "^N225", "^KS11", "ACWI", "VIXCLS"]
  - id: markets/fx
    nome: FX
    gruppo: markets
    stato: attiva
    descrizione: The euro, yen, yuan and won against the US dollar, and the broad dollar index.
    numeri_chiave: ["EXR/D.USD.EUR.SP00.A", "JPY=X", "CNY=X", "KRW=X", "DTWEXBGS"]
  - id: markets/commodities
    nome: Commodities
    gruppo: markets
    stato: attiva
    descrizione: Energy, metals and agricultural prices, how they have changed recently, and how they relate to US interest rates.
    numeri_chiave: ["BZ=F", "CL=F", "NG=F", "GC=F", "HG=F", "ZW=F"]
    ytd: true

# Recessioni disegnate come bande grigie, per le regioni senza una serie scaricabile.
# (Per gli USA si usa la serie FRED USREC, più in basso.)
recessioni:
  eurozona:
    # Fonte: CEPR-EABCN Euro Area Business Cycle Dating Committee (https://cepr.org),
    # l'equivalente europeo del NBER. Non ha un'API: le date vanno copiate a mano
    # quando il comitato annuncia un nuovo picco o minimo.
    # picco = ultimo trimestre di espansione; minimo = ultimo trimestre di recessione.
    # Elenco aggiornato alla recessione Covid del 2020. A settembre 2026 il sito CEPR non era
    # consultabile in automatico: controllare a mano se ci sono annunci successivi.
    fonte: CEPR-EABCN Euro Area Business Cycle Dating Committee
    periodi:
      - {picco: 1974Q3, minimo: 1975Q1}
      - {picco: 1980Q1, minimo: 1982Q3}
      - {picco: 1992Q1, minimo: 1993Q3}
      - {picco: 2008Q1, minimo: 2009Q2}
      - {picco: 2011Q3, minimo: 2013Q1}
      - {picco: 2019Q4, minimo: 2020Q2}

# Colori fissi dei grafici: ogni Paese (e ogni gruppo di materie prime) ha SEMPRE lo stesso colore, in tutte le pagine.
# "chiaro" e "scuro" sono lo stesso colore regolato per i due temi. Gli 8 colori dei Paesi sono stati verificati con
# tools/valida_palette.py (tutte le 28 coppie: distinguibili anche con daltonismo; contrasto con lo sfondo almeno 3:1 in entrambi
# i temi; da rilanciare se si cambia un colore).
# "alias: us" = stesso colore di un'altra voce. "mondo" è il colore neutro del benchmark (indice mondiale).
# In un grafico, più serie con lo stesso colore si distinguono dallo stile della linea (piena, tratteggiata, puntinata).
colori:
  us: {nome: United States,  gruppo: paese, chiaro: "#2e4aa6", scuro: "#5d89ff"}
  ea: {nome: Euro area,      gruppo: paese, chiaro: "#c27d00", scuro: "#ca8412"}
  it: {nome: Italy,          gruppo: paese, chiaro: "#2ea46c", scuro: "#3bad75"}
  jp: {nome: Japan,          gruppo: paese, chiaro: "#bf1000", scuro: "#d5301c"}
  cn: {nome: China,          gruppo: paese, chiaro: "#de37a5", scuro: "#c3118e"}
  kr: {nome: South Korea,    gruppo: paese, chiaro: "#8b59f9", scuro: "#7942e2"}
  uk: {nome: United Kingdom, gruppo: paese, chiaro: "#5183c1", scuro: "#3a6ca8"}
  fr: {nome: France,         gruppo: paese, chiaro: "#1a6937", scuro: "#2f7a47"}
  energia:             {nome: Energy,            gruppo: materia_prima, alias: jp}
  metalli_preziosi:    {nome: Precious metals,   gruppo: materia_prima, alias: ea}
  metalli_industriali: {nome: Industrial metals, gruppo: materia_prima, alias: kr}
  agricoli:            {nome: Agricultural,      gruppo: materia_prima, alias: it}
  mondo:               {nome: World benchmark,   gruppo: neutro, chiaro: "#52514e", scuro: "#c3c2b7"}

