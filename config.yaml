# =====================================================================
# CONFIGURAZIONE DELLA DASHBOARD
# ---------------------------------------------------------------------
# Qui si decide QUALI dati scaricare. Il codice Python legge questo file
# e non contiene elenchi di serie "scritti a mano".
#
# Per aggiungere una serie basta copiare un blocco e cambiarne i campi:
#   id             codice della serie presso la fonte (es. su FRED "DGS10")
#   fonte          modulo che la scarica: "fred", "ecb", "yahoo", "bis", "mof" (Giappone) o "statjp"
#                  (Statistics Bureau of Japan via DBnomics)
#                  oppure "calcolata" = differenza o rapporto tra due altre serie (vedi componenti)
#                  Per la BCE l'id è "DATASET/CHIAVE", es. FM/D.U2.EUR.4F.KR.DFR.LEV
#                  Per Yahoo l'id è il ticker, es. CL=F (future continuo sul WTI)
#                  Per il BIS l'id è "DATASET/CHIAVE", es. WS_CBPOL/D.JP (tasso di policy del Giappone)
#                  Per "mof" l'id è JGB_ seguito dalla scadenza, es. JGB_10Y; per "statjp" è "CPIm/740"
#   nome           etichetta mostrata sul sito
#   regione        tab in cui compare (deve esistere nella lista "regioni")
#   categoria      gruppo tematico (serve a orientarsi e per i confronti futuri)
#   unita          unità DOPO la trasformazione: "%", "% a/a", "indice", "punti"
#   trasformazione "livello" = dato così com'è
#                  "yoy"     = variazione % rispetto a un anno prima
#   riepilogo      true = compare nella scheda riassuntiva in cima alla pagina
#
# Campi facoltativi:
#   riserva        fonte alternativa se la principale non risponde, es.
#                    riserva: {fonte: fred, id: ECBDFR}
#                  (si può aggiungere "trasformazione" se diversa da quella principale,
#                  "unita" se la riserva è in un'altra unità di misura e "nota" per
#                  spiegare in cosa è diversa, es. "prezzo spot, non future")
#   componenti     solo per fonte "calcolata": [A, B] -> la serie è A − B,
#                  calcolata nelle date in cui esistono entrambe.
#                  REGOLA: si calcola solo se A e B vengono dalla stessa fonte principale;
#                  se anche una sola è passata alla riserva, la serie è "non disponibile".
#   operazione     solo per fonte "calcolata": "differenza" (A − B, predefinita) o "rapporto" (A / B)
#   fattore        solo per fonte "calcolata": moltiplica il risultato (es. 1000 per un rapporto piccolo)
#   decimali       cifre decimali mostrate sul sito (predefinito 2)
#   soglia_giorni  soglia di freschezza propria della serie (giorni), al posto di quella standard
#                  per la sua frequenza. Da usare SOLO con un motivo scritto accanto (es. fonte lenta)
#
# Nota: una serie scaricata ma non usata da nessun grafico compare comunque
# nella scheda riassuntiva (se riepilogo: true) e nella tabella "Stato delle serie".
# =====================================================================

# Tab mostrate in cima al sito. "attiva: false" = tab visibile ma "in arrivo".
regioni:
  - id: usa
    nome: Stati Uniti
    attiva: true
  - id: eurozona
    nome: Eurozona
    attiva: true
  # Non è una regione geografica, ma usa la stessa struttura (dashboard/regions/commodities.py)
  - id: commodities
    nome: Commodities
    attiva: true
  # Asia (fase 3): tre paesi, nessuna banda di recessione (nessuna fonte ufficiale e automatica)
  - id: giappone
    nome: Giappone
    attiva: true
  - id: cina
    nome: Cina
    attiva: true
  - id: corea
    nome: Corea del Sud
    attiva: true
  - id: globale
    nome: Confronto globale
    attiva: true

# Recessioni disegnate come bande grigie, per le regioni senza una serie scaricabile.
# (Per gli USA si usa la serie FRED USREC, più in basso.)
recessioni:
  eurozona:
    # Fonte: CEPR-EABCN Euro Area Business Cycle Dating Committee (https://cepr.org),
    # l'equivalente europeo del NBER. Non ha un'API: le date vanno copiate a mano
    # quando il comitato annuncia un nuovo picco o minimo.
    # picco = ultimo trimestre di espansione; minimo = ultimo trimestre di recessione.
    # Elenco aggiornato alla recessione Covid del 2020. A settembre 2026 il sito CEPR non era
    # consultabile in automatico: controllare a mano se ci sono annunci successivi.
    fonte: CEPR-EABCN Euro Area Business Cycle Dating Committee
    periodi:
      - {picco: 1974Q3, minimo: 1975Q1}
      - {picco: 1980Q1, minimo: 1982Q3}
      - {picco: 1992Q1, minimo: 1993Q3}
      - {picco: 2008Q1, minimo: 2009Q2}
      - {picco: 2011Q3, minimo: 2013Q1}
      - {picco: 2019Q4, minimo: 2020Q2}

