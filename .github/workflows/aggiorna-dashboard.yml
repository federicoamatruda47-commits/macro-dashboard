# =====================================================================
# Aggiornamento automatico su GitHub
# Ogni giorno GitHub avvia un computer temporaneo, scarica i dati,
# genera il sito e lo pubblica su GitHub Pages.
#
# Prerequisiti (da fare una volta sola sul sito di GitHub):
#   1. Settings > Secrets and variables > Actions > New repository secret
#      Nome: FRED_API_KEY   Valore: la tua chiave FRED
#   2. Settings > Pages > Source: "GitHub Actions"
# =====================================================================
name: Aggiorna dashboard

on:
  schedule:
    - cron: "30 23 * * 1-6"  # lun-sab alle 23:30 UTC (01:30 italiane): future USA chiusi dalle 21-22 UTC, borse asiatiche chiuse
  workflow_dispatch:          # permette di avviarlo a mano dalla scheda "Actions"
  push:
    branches: [main]          # e a ogni modifica del codice

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  genera:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Installa le librerie
        run: pip install -r requirements.txt

      # I test usano solo dati inventati (niente rete, niente chiave): se uno fallisce il job si ferma qui,
      # il sito non viene generato e resta online la versione precedente
      - name: Esegui i test
        run: python -m unittest discover -s tests -t . -v

      - name: Scarica i dati e genera il sito
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python build.py  # se NESSUNA serie si scarica, esce con errore e non pubblica

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  pubblica:
    needs: genera
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  # Avviso di inattività: GitHub spegne i workflow programmati dei repository pubblici dopo 60 giorni senza attività, senza dirlo.
  # Se l'ultimo commit ha più di 45 giorni questo job apre UNA issue (mai due uguali) e la chiude quando torna un commit.
  # Non dipende dagli altri job: se la build fallisce l'avviso arriva lo stesso. L'avviso NON compare sul sito pubblico.
  controlla-attivita:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - name: Controlla da quanto non c'è un commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/controlla_attivita.py
