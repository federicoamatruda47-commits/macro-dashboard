# =====================================================================
# PROVA TEMPORANEA (step 10a): le API dell'FMI e della Banca Mondiale
# rispondono dai computer di GitHub Actions? Il risultato decide come
# si scrivono imf.py e worldbank.py. Si cancella a fine prova.
# Parte da sola a ogni push del ramo di prova e si può avviare a mano.
# Non scrive nulla e non pubblica nulla.
# =====================================================================
name: Prova API (temporanea)

on:
  workflow_dispatch:
  push:
    branches: [ristrutturazione/step-10a]
    paths:
      - ".github/workflows/prova-api.yml"
      - "tools/prova_api_actions.py"

permissions:
  contents: read

jobs:
  prova:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Prova le API
        run: python3 tools/prova_api_actions.py | tee prova.txt
      - name: Riepilogo
        if: always()
        run: |
          echo '### Prova API da GitHub Actions' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat prova.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
