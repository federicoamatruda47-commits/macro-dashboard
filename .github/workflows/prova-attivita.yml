# PROVA TEMPORANEA (step 10a): prova la issue dell'avviso di inattività con la issue vera ("[PROVA] ...") e poi si cancella.
name: Prova avviso inattività (temporanea)

on:
  push:
    branches: [ristrutturazione/step-10a]
    paths: [".github/workflows/prova-attivita.yml"]

jobs:
  prova:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: 1. Soglia a 0 - deve aprire una issue
        run: python3 tools/controlla_attivita.py --soglia 0 --prova
      - name: 2. Di nuovo - NON deve aprirne un'altra
        run: python3 tools/controlla_attivita.py --soglia 0 --prova
      - name: Quante issue "[PROVA]" aperte ci sono? (deve essere 1)
        run: |
          n="$(gh issue list --state open --json title --jq '[.[] | select(.title | startswith("[PROVA]"))] | length')"
          echo "Issue [PROVA] aperte: $n"
          test "$n" = "1"
      - name: 3. Soglia a 999 - deve chiudere la issue
        run: python3 tools/controlla_attivita.py --soglia 999 --prova
      - name: Quante issue "[PROVA]" aperte ci sono? (deve essere 0)
        run: |
          n="$(gh issue list --state open --json title --jq '[.[] | select(.title | startswith("[PROVA]"))] | length')"
          echo "Issue [PROVA] aperte: $n"
          test "$n" = "0"
