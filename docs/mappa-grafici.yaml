# Dove finisce ogni grafico esistente (vedi docs/ristrutturazione.md, sezione 4).
# Letto da tools/inventario.py.
#
# esito:   kept   = il grafico resta (stesso id)
#          moved  = il grafico si sposta in un'altra pagina (stesso id)
#          merged = il grafico sparisce e le sue serie entrano nel grafico "in" (nuovo o esistente)
# pagina:  percorso della pagina di destinazione
# in:      solo per merged: id del grafico che raccoglie le sue serie (tutte, verificato dal controllo)
#
# I grafici nuovi hanno id provvisori (mk-...): vanno creati nello step indicato.

grafici:
